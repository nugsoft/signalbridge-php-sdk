name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The package requires ^8.1; test the floor and every version since.
        php: ["8.1", "8.2", "8.3", "8.4"]
        dependencies: ["highest"]
        include:
          # Also prove the declared minimums actually resolve and pass.
          - php: "8.1"
            dependencies: "lowest"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-dist --no-interaction --no-progress
          else
            composer update --prefer-dist --no-interaction --no-progress
          fi

      - name: Run tests
        # Every test fakes the HTTP layer with Guzzle's MockHandler. If one ever
        # reached the real gateway it would send a real SMS and bill the account.
        run: vendor/bin/phpunit
